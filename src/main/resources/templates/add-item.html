<!DOCTYPE html>
<html>

<head>

    <title>Add Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

    </style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-5" style="width:500px;">

        <h2 class="text-center mb-4">Add New Item</h2>

        <form action="/add" method="post">

            <!-- ITEM ID -->
            <div class="mb-3">
                <input class="form-control"
                       name="id"
                       placeholder="Item ID"
                       required
                       pattern="^[A-Za-z0-9_-]{3,10}$"
                       title="3–10 characters, letters/numbers only">
            </div>

            <!-- NAME -->
            <div class="mb-3">
                <input class="form-control"
                       name="name"
                       placeholder="Item Name"
                       required
                       maxlength="50"
                       minlength="3"
                       pattern="^[A-Za-z0-9 ]+$"
                       title="Only letters, numbers and spaces allowed">
            </div>

            <!-- QUANTITY -->
            <div class="mb-3">
                <input class="form-control"
                       name="quantity"
                       placeholder="Quantity"
                       required
                       max="10000"
                       min="1"
                       title="Quantity must be between 1 and 10000"
                       type="number">
            </div>

            <!-- PRICE -->
            <div class="mb-3">
                <input class="form-control"
                       name="price"
                       placeholder="Price"
                       required
                       max="1000000"
                       step="0.01"
                       min="0.01"
                       title="Price must be greater than 0"
                       type="number">
            </div>

            <div class="d-grid gap-2">

                <button class="btn btn-success w-100">
                    Save Item
                </button>

                <a class="btn btn-outline-secondary w-100" href="/dashboard">
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
