<!DOCTYPE html>
<html>

<head>

    <title>Add Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

    </style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-5" style="width:500px;">

        <h2 class="text-center mb-4">Add New Item</h2>

        <form action="/add" method="post">

            <div class="mb-3">
                <input class="form-control"
                       name="id"
                       placeholder="Item ID"
                       required
                       type="text">
            </div>

            <div class="mb-3">
                <input class="form-control"
                       name="name"
                       placeholder="Item Name"
                       required
                       type="text">
            </div>

            <div class="mb-3">
                <input class="form-control"
                       name="quantity"
                       placeholder="Quantity"
                       required
                       type="number">
            </div>

            <div class="mb-3">
                <input class="form-control"
                       name="price"
                       placeholder="Price"
                       required
                       step="0.01"
                       type="number">
            </div>

            <button class="btn btn-success w-100">
                Save Item
            </button>

        </form>

    </div>

</div>

</body>
</html>
