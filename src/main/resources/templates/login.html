<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 80px;
            margin: auto;
            display: block;
        }

        .btn-custom {
            background: #111827;
            color: white;
        }

        .btn-custom:hover {
            background: #0f172a;
        }
    </style>
</head>

<body>

<div class="login-card text-center">

    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/295/295128.png">

    <h4 class="mt-3">Inventory Login</h4>
    <p class="text-muted">Welcome back 👋</p>

    <form action="/login" method="post">

        <input class="form-control mb-3" name="username" placeholder="Username">

        <input class="form-control mb-3" name="password" placeholder="Password" type="password">

        <button class="btn btn-custom w-100">Login</button>

    </form>

    <p class="mt-3 text-muted small">Don't have account? Contact admin</p>

</div>

</body>
</html>
