<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        .profile-container {
            max-width: 900px;
            margin: 60px auto;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #111827;
            object-fit: cover;
        }

        .info h3 {
            margin-bottom: 5px;
        }

        .badge-role {
            background: #111827;
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .stats {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 100px;
        }

        .logout-btn {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="profile-container">

    <div class="profile-card">

        <!-- AVATAR -->
        <img class="avatar"
             src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        <!-- INFO -->
        <div class="info">

            <h3>Admin User</h3>
            <span class="badge-role">Inventory Manager</span>

            <p class="text-muted mt-2">
                System administrator responsible for inventory control and stock management.
            </p>

            <!-- STATS -->
            <div class="stats">

                <div class="stat-box">
                    <h5>24</h5>
                    <small>Items</small>
                </div>

                <div class="stat-box">
                    <h5>5</h5>
                    <small>Low Stock</small>
                </div>

                <div class="stat-box">
                    <h5>1</h5>
                    <small>Reports</small>
                </div>

            </div>

            <!-- BUTTONS -->
            <div class="logout-btn">

                <a class="btn btn-dark btn-sm" href="/dashboard">Back</a>

                <a class="btn btn-danger btn-sm"
                   href="/logout"
                   onclick="return confirm('Are you sure you want to logout?')">
                    Logout
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
