<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Inventory Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f4f7fc;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            background: #1e293b;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #334155;
        }

        .main {
            margin-left: 250px;
            padding: 20px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .topbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h4 class="text-white text-center mb-4">Inventory</h4>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/add">➕ Add Item</a>
    <a href="/report">📄 Download PDF Report</a>
    <a href="/profile">👤 Profile</a>
    <a href="/logout">🚪 Logout</a>

</div>

<!-- MAIN CONTENT -->
<div class="main">

    <div class="topbar d-flex justify-content-between align-items-center">

        <h3>Dashboard</h3>

        <form action="/dashboard" class="d-flex" method="get">
            <input class="form-control me-2" name="search" placeholder="Search item...">
            <button class="btn btn-primary">Search</button>
        </form>

    </div>

    <div class="card p-3">

        <table class="table table-hover">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="i : ${items}">
                <td th:text="${i.id}"></td>
                <td th:text="${i.name}"></td>
                <td th:text="${i.quantity}"></td>
                <td th:text="${i.price}"></td>

                <td>
                    <a class="btn btn-warning btn-sm" th:href="@{/edit/{id}(id=${i.id})}">Edit</a>
                    <a class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')"
                       th:href="@{/delete/{id}(id=${i.id})}">Delete</a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

    const urlParams = new URLSearchParams(window.location.search);
    const success = urlParams.get('success');

    if (success === 'added') {
        Swal.fire('Success!', 'Item Added Successfully!', 'success');
    }

    if (success === 'updated') {
        Swal.fire('Updated!', 'Item Updated Successfully!', 'success');
    }

    if (success === 'deleted') {
        Swal.fire('Deleted!', 'Item Deleted Successfully!', 'success');
    }

    if (success === 'report') {
        Swal.fire('Done!', 'Report Generated Successfully!', 'success');
    }

</script>

</body>
</html>
